# Builds the image the QNAP runs and publishes it to the GitHub Container Registry,
# so the NAS updates by pulling instead of importing an archive copied to a share.
#
#   push to main  ->  ghcr.io/<owner>/readroom:latest  and  :sha-<commit>
#   tag v1.2.3    ->  :1.2.3  and  :sha-<commit>
#   run by hand   ->  :sha-<commit>  (plus :latest when run on main)
#
# deploy/qnap-compose.yaml points at :latest; a :sha-… or version tag is there to go back to.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    # A push that only touches documentation or the deployment notes changes nothing in the image.
    paths-ignore: ['**.md', 'docs/**', 'deploy/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The Go cache is saved once per key. Keying it on this file too means a
          # change to what is compiled here (such as the cross-builds below) gets a
          # fresh cache that holds it.
          cache-dependency-path: |
            go.sum
            .github/workflows/image.yml

      # Nothing is published from a tree that does not pass.
      - run: go vet ./...
      - run: go test ./...

      # Compiled here rather than inside the image build: the Go build cache above
      # survives between runs, so only what changed is recompiled, for both targets.
      - name: Build the binaries
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "prebuilt/out/$arch/readroom" ./cmd/readroom
          done
          mkdir -p prebuilt/out/data

      - name: Work out the image tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags,$image:latest"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags,$image:${GITHUB_REF_NAME#v}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 for the QNAP, amd64 for Proxmox. The "build" context replaces the
      # Dockerfile's compile stage with the binaries built above, so all that is
      # left is copying them onto the base image. No provenance attestation: it
      # turns the manifest into an index with extra entries that older Docker
      # engines can trip over.
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: build=prebuilt
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
