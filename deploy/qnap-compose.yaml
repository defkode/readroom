# Container Station application for the QNAP: Readroom behind its own Tailscale
# node, served at https://readroom.<tailnet>.ts.net. No ports are published on the NAS.
#
# The image is built by GitHub Actions (.github/workflows/image.yml) and pulled from
# the GitHub Container Registry; recreating the application fetches the newest one.
# While the package is private, the NAS needs a ghcr.io login to pull it (a GitHub
# token with read:packages only). To pin or go back, replace ":latest" with a
# ":sha-<commit>" or version tag.
# On first start, open the tailscale container's log and follow the newest login
# link within 60 seconds (the container restarts with a fresh link after that).
#
# Replace CHANGE_ME below with your own token (openssl rand -hex 24) in Container
# Station's editor, and keep it in a password manager. Never commit the real value.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: readroom
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - /share/Container/readroom-ts/state:/var/lib/tailscale
      - /share/Container/readroom-ts/config:/config
    command:
      - sh
      - -c
      - |
        mkdir -p /config
        cat > /config/serve.json <<'EOF'
        {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://app:8090"}}}}}
        EOF
        exec /usr/local/bin/containerboot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
  # Named "app", not "readroom": the tailscale container's own hostname is
  # "readroom", which would shadow the service name in its DNS lookups.
  app:
    image: ghcr.io/defkode/readroom:latest
    pull_policy: always
    user: "0:0" # the bind-mounted share is not writable by the image's default user
    environment:
      # Set directly rather than through READROOM_TOKEN_FILE: a token file written by
      # the container is root-only on the share, and File Station cannot open it.
      - READROOM_TOKEN=CHANGE_ME
      - READROOM_INTERVAL=30m
    volumes:
      - /share/Container/readroom:/data
    restart: always
