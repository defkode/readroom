# An example: Readroom behind its own Tailscale node, served over HTTPS at
# https://readroom.<tailnet>.ts.net with no port published on the host.
#
# The image is built by GitHub Actions (.github/workflows/image.yml) and pulled from
# the GitHub Container Registry; "docker compose pull && docker compose up -d" fetches
# the newest one. To pin or go back, replace ":latest" with a ":sha-<commit>" or
# version tag.
#
# On first start, open the tailscale container's log and follow the newest login
# link within 60 seconds (the container restarts with a fresh link after that).
#
# The access token is generated on first start into the data volume, as the file
# "token". To choose your own, set READROOM_TOKEN instead (openssl rand -hex 24)
# and keep it out of version control.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: readroom
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
    command:
      - sh
      - -c
      - |
        mkdir -p /config
        cat > /config/serve.json <<'EOF'
        {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://app:8090"}}}}}
        EOF
        exec /usr/local/bin/containerboot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  # Named "app", not "readroom": the tailscale container's own hostname is
  # "readroom", which would shadow the service name in its DNS lookups.
  app:
    image: ghcr.io/defkode/readroom:latest
    pull_policy: always
    environment:
      - READROOM_TOKEN_FILE=/data/token
      - READROOM_INTERVAL=30m
      # Optional: your own language, to have articles translated into it on request.
      # - READROOM_LANGUAGE=pl
    volumes:
      - readroom-data:/data
    restart: unless-stopped

volumes:
  readroom-data:
  tailscale-state:
